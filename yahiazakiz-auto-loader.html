<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yahiazakiz os</title></head>
<body style="margin:0;background:#111b24;color:#eef5fc;font:16px system-ui;padding:24px">
<p id="status" role="status">Checking for the latest yahiazakiz os…</p>
<pre id="why" style="white-space:pre-wrap;font-size:12px;color:#9fb3c8" hidden></pre>
<div id="fix" hidden style="margin:12px 0;display:flex;flex-direction:column;gap:8px;max-width:420px">
<label>GitHub repo (owner/name)<input id="inRepo" style="width:100%;padding:8px;box-sizing:border-box"></label>
<label>File name in the repo (blank = auto-detect)<input id="inFile" style="width:100%;padding:8px;box-sizing:border-box"></label>
<button id="use">Use these and try again</button></div>
<button id="retry" hidden>Try again</button><button id="older" hidden>Load saved version instead</button>
<script>
(()=>{
let repo='altaltalt717-png/code',fileHint='yahiazakiz_os.html';const branch='main';
const $=id=>document.getElementById(id),status=$('status'),retry=$('retry'),older=$('older'),whyEl=$('why'),fix=$('fix');
let saved='',busy=false,why=[];
try{const c=JSON.parse(localStorage.getItem('yz-loader-cfg')||'null');if(c&&/^[\w.-]+\/[\w.-]+$/.test(c.repo)){repo=c.repo;fileHint=c.file||''}}catch{}
const key='yz-loader-'+repo.replace(/\W/g,'_')+'-commit';
try{saved=localStorage.getItem(key)||''}catch{}
const isSha=s=>/^[a-f0-9]{40}$/.test(s),enc=n=>encodeURIComponent(n).replace(/%2F/g,'/');
const tf=(u,ms)=>fetch(u,{cache:'no-store',signal:AbortSignal.timeout(ms)});
const raw=(ref,n)=>'https://raw.githubusercontent.com/'+repo+'/'+ref+'/'+enc(n);
const cdns=(ref,n)=>['cdn.jsdelivr.net','fastly.jsdelivr.net','gcore.jsdelivr.net'].map(h=>'https://'+h+'/gh/'+repo+'@'+ref+'/'+enc(n));
const rank=n=>{n=n.toLowerCase();return(/yahiazakiz/.test(n)?0:2)+(/os/.test(n)?0:1)+(/loader/.test(n)?5:0)};
async function names(ref){
  if(fileHint)return[fileHint];
  let l=[];try{const r=await tf('https://api.github.com/repos/'+repo+'/contents/?ref='+ref,8000);if(r.ok)l=(await r.json()).filter(f=>f.type==='file'&&/\.html?$/i.test(f.name)).map(f=>f.name).sort((a,b)=>rank(a)-rank(b));else why.push('File list: HTTP '+r.status+(r.status==404?' (repo not found, private, or wrong name)':''))}catch(e){why.push('File list: '+(e.name||'error'))}
  return[...new Set(['yahiazakiz_os.html'].concat(l,['yahiazakiz os.html','yahiazakiz_os.html','yahiazakiz-os.html','index.html']))];
}
async function download(url,ref){const h=url.split('/').slice(2,3)+' '+decodeURIComponent(url.split('/').pop());try{
  const r=await tf(url+'?yz_load='+Date.now(),180000);if(!r.ok){why.push(h+': HTTP '+r.status);return false}
  const total=+r.headers.get('content-length')||0,parts=[];let got=0;
  if(r.body){const rd=r.body.getReader(),dec=new TextDecoder();for(;;){const{done,value}=await rd.read();if(done)break;got+=value.length;parts.push(dec.decode(value,{stream:true}));status.textContent='Downloading… '+(got/1048576).toFixed(1)+(total?' / '+(total/1048576).toFixed(1):'')+' MB'}parts.push(dec.decode())}else parts.push(await r.text());
  const html=parts.join('');
  if(!/<html[\s>]/i.test(html)||!html.includes('yahiazakiz os')){why.push(h+': downloaded '+(html.length/1048576).toFixed(1)+' MB but it is not the OS file');return false}
  try{if(isSha(ref))localStorage.setItem(key,ref)}catch{}
  window.yzLoaderInfo={ref,source:url};document.open();document.write(html);document.close();return true}catch(e){why.push(h+': '+(e.name==='TimeoutError'?'timed out':e.name+' '+String(e.message).slice(0,50)));return false}}
async function start(){if(busy)return;busy=true;why=[];retry.hidden=older.hidden=fix.hidden=whyEl.hidden=true;status.textContent='Checking for the latest yahiazakiz os…';let latest='';
  for(const b of[branch,'master']){try{const r=await tf('https://api.github.com/repos/'+repo+'/commits/'+b+'?yz_check='+Date.now(),8000);if(r.ok){const d=await r.json();if(isSha(d.sha)){latest=d.sha;break}}else why.push('Latest version check ('+b+'): HTTP '+r.status)}catch(e){why.push('Latest version check: '+(e.name||'error'))}}
  /* A known current commit must never silently fall back to an older commit. */
  const ref=latest||branch,list=await names(ref);
  for(const url of[...list.map(n=>raw(ref,n)),...cdns(ref,list[0])]){status.textContent=latest?'Loading the latest verified version…':'GitHub version check unavailable. Trying the current branch…';if(await download(url,ref))return}
  busy=false;status.textContent='The current version could not be loaded. Check the details below, fix the repo or file name if needed, then retry.';
  whyEl.textContent='Repo: '+repo+'\n'+why.join('\n');whyEl.hidden=false;$('inRepo').value=repo;$('inFile').value=fileHint;fix.hidden=false;retry.hidden=false;older.hidden=!isSha(saved)}
$('use').onclick=()=>{const r=$('inRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');if(!/^[\w.-]+\/[\w.-]+$/.test(r)){status.textContent='Repo must look like owner/name.';return}try{localStorage.setItem('yz-loader-cfg',JSON.stringify({repo:r,file:$('inFile').value.trim()}))}catch{}location.reload()};
retry.onclick=start;
older.onclick=async()=>{if(busy)return;busy=true;status.textContent='Loading your saved version (may be outdated)…';for(const n of await names(saved))if(await download(raw(saved,n),saved))return;busy=false;status.textContent='Saved version unavailable. Check your connection and retry.'};
start();
})();
</script></body></html>
